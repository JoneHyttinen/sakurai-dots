source = ~/.config/hypr/hyprlock-colors.conf

$font = Satoshi

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.cache/wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext
    font_size = 18
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    rounding = 14
    outline_thickness = 2
    inner_color = $field
    outer_color = $outline
    check_color = $primary
    fail_color = $error
    font_color = $text
    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# ── Power buttons, bottom-right ─────────────────────────

# Shut down
shape {
    monitor =
    size = 52, 52
    rounding = 14
    color = $field
    border_size = 1
    border_color = $primary
    position = -24, 24
    halign = right
    valign = bottom
    onclick = systemctl poweroff
}
label {
    monitor =
    text = power_settings_new
    font_family = Material Symbols Rounded
    font_size = 22
    color = $text
    position = -37, 33
    halign = right
    valign = bottom
    onclick = systemctl poweroff
}

# Reboot
shape {
    monitor =
    size = 52, 52
    rounding = 14
    color = $field
    border_size = 1
    border_color = $primary
    position = -88, 24
    halign = right
    valign = bottom
    onclick = systemctl reboot
}
label {
    monitor =
    text = restart_alt
    font_family = Material Symbols Rounded
    font_size = 22
    color = $text
    position = -100, 35
    halign = right
    valign = bottom
    onclick = systemctl reboot
}
