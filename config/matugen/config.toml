[config]

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell.json'
output_path = '~/.cache/matugen/quickshell.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/config/matugen.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/matugen.toml'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.kde]
input_path = '~/.config/matugen/templates/kde.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-palette.lua'
output_path = '~/.config/nvim/lua/matugen_palette.lua'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox.json'
output_path = '~/.cache/wal/colors.json'

[templates.vesktop]
input_path = '~/.config/matugen/templates/vesktop.css'
output_path = '~/.config/vesktop/themes/matugen.theme.css'

[templates.spicetify]
input_path = '~/.config/matugen/templates/spicetify.ini'
output_path = '~/.config/spicetify/Themes/Matugen/color.ini'
